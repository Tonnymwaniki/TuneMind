services:
  - type: web
    name: tunemind-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build:emit
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
